changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: "🚨 Breaking Changes"
      labels:
        - breaking
    - title: "🚀 Features"
      labels:
        - enhancement
        - feature
    - title: "🐞 Bug Fixes"
      labels:
        - bug
        - fix
    - title: "🧹 Maintenance"
      labels:
        - dependencies
        - maintenance
    - title: "Other Changes"
      labels:
        - "*"
