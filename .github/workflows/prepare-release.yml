name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      release:
        description: Version increment
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: prepare-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: versioning
    steps:
      - name: Create release bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Select next version
        run: pnpm exec bumpp "${{ inputs.release }}" -r --yes --no-commit --no-tag --no-push

      - name: Update lockfile
        run: pnpm install --lockfile-only

      - name: Verify release
        run: pnpm release:verify

      - name: Configure release bot
        id: bot
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          bot_name="${{ steps.app-token.outputs.app-slug }}[bot]"
          bot_id="$(gh api "/users/$bot_name" --jq .id)"
          git config user.name "$bot_name"
          git config user.email "$bot_id+${bot_name}@users.noreply.github.com"
          echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create release commit and tag
        shell: bash
        run: |
          git add package.json packages/*/package.json pnpm-lock.yaml
          git commit -m "chore: release ${{ steps.bot.outputs.tag }}"
          git tag -a "${{ steps.bot.outputs.tag }}" -m "${{ steps.bot.outputs.tag }}"
          git push --atomic origin HEAD:main "${{ steps.bot.outputs.tag }}"
